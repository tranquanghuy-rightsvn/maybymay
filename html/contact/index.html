<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>May By Mây – Liên hệ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/images/logo.jpeg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page-inner page-contact">

<main>
  <div class="container-xl contact">
    <div class="contact__top">
      <div class="contact__info">
        <h3 class="contact__title">MAY BY MÂY</h3>
        <strong>HOTLINE / ZALO</strong>
        <div class="contact__lines">
          <div><a href="tel:0327666248">0327 666 248</a></div><div></div>
          <div><strong>WEBSITE</strong></div><div></div>
          <div>maybymay.vn</div>
        </div>
        <div class="contact__lines"><div></div><div><strong>THÔNG TIN KINH DOANH</strong></div><div></div>
          <div>Hộ Kinh Doanh Thời Trang May By Mây</div>
          <div>GPKD do Phòng kinh tế, hạ tầng và đô thị thuộc UBND Phường Hoàng Liệt cấp ngày 05/02/2026</div>
          <div>MST: 038098030181</div></div>
      </div>
      <div class="contact__form-col">
        <h3 class="contact__title">LIÊN HỆ VỚI CHÚNG TÔI</h3>
        <form class="contact__form" id="contact-form" data-demo-form>
          <input type="text" placeholder="TÊN" required>
                    <input type="email" placeholder="EMAIL" required>
          <input type="text" placeholder="SỐ ĐIỆN THOẠI">
          <input type="text" placeholder="MÃ ĐƠN HÀNG">
          <select>
            <option value="">LIÊN HỆ VỀ</option>
            <option>Tư vấn size</option>
            <option>Đơn hàng</option>
            <option>Hợp tác</option>
            <option>Khác</option>
          </select>
          <textarea placeholder="Lời nhắn" required></textarea>
        </form>
      </div>
      <div class="contact__send-col">
        <div class="contact__send">
          <button type="submit" form="contact-form">send</button>
          <p class="contact__msg" hidden>Đây là bản demo — form không gửi dữ liệu đi đâu.</p>
        </div>
      </div>
    </div>
    <div class="contact__bottom">
      <div class="contact__image">
        <img src="/images/home/hero-2-1280.webp" srcset="/images/home/hero-2-768.webp 768w, /images/home/hero-2-1280.webp 1280w, /images/home/hero-2-1920.webp 1920w" sizes="100vw" alt="May By Mây" width="1920" height="640" loading="lazy">
      </div>
    </div>
  </div>
</main>

<script src="/js/store.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/main.js"></script>
<script src="/js/pages/contact.js"></script>
</body>
</html>
