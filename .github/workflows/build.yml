name: Build site from CMS data

# CMS (gas/, xem GAS.md) ghi nhiều commit liên tiếp cho 1 thao tác: ảnh -> detail.json -> index.
# Chỉ trigger ở đúng file index (luôn là commit CHỐT, ghi sau cùng) để không build trạng thái dở dang.
on:
  push:
    branches: [master]
    paths:
      - 'data/products.json'
      - 'data/blog.json'
      - 'data/pages.json'
      - 'scripts/build.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build HTML from data/
        run: python3 scripts/build.py

      # Commit html/ đã build -> Cloudflare (kết nối với repo) tự triển khai từ commit này.
      - name: Commit built HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A: kèm cả việc XOÁ trang mồ côi (sản phẩm / bài đã xoá qua CMS)
          git add -A html/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "CI: build html from data"
          # CMS có thể vừa ghi thêm commit trong lúc build -> rebase rồi mới đẩy
          git pull --rebase origin master
          git push
